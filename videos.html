<script>
/* 返回：根据用户身份跳转 */
function goBack(){

  if(localStorage.getItem('sb_admin') || sessionStorage.getItem('sb_admin')){

/* 视频下载限制功能（集成数据库） */
function getCurrentUserInfo(){
  var sess = JSON.parse(localStorage.getItem('sb_session') || sessionStorage.getItem('sb_session') || 'null');
  if(sess && sess.uid){
    return { type: 'user', uid: sess.uid, name: sess.name || '用户' };
  }
  var visitorId = localStorage.getItem('visitor_download_id');
  if(!visitorId){
    visitorId = 'visitor_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('visitor_download_id', visitorId);
  }
  return { type: 'visitor', uid: null, visitor_id: visitorId, name: '访客' };
}

// 从数据库查询是否已经下载过
function checkDownloadedFromDB(videoName, callback){
  var userInfo = getCurrentUserInfo();
  var queryUrl = SUPABASE_URL + '/rest/v1/video_downloads?select=*&video_name=eq.' + encodeURIComponent(videoName);
  
  if(userInfo.type === 'user'){
    queryUrl += '&user_id=eq.' + userInfo.uid;
  } else {
    queryUrl += '&visitor_id=eq.' + userInfo.visitor_id;
  }
  
  fetch(queryUrl, {
    method: 'GET',
    headers: {
      'apikey': ANON_KEY,
      'Authorization': 'Bearer ' + ANON_KEY,
      'Content-Type': 'application/json'
    }
  })
  .then(function(res){ return res.json(); })
  .then(function(data){
    callback(data && data.length > 0);
  })
  .catch(function(err){
    console.error('查询下载记录失败:', err);
    // 查询失败时，用localStorage作为后备
    var downloads = JSON.parse(localStorage.getItem('video_downloads') || '{}');
    var key = userInfo.type === 'user' ? 'user_' + userInfo.uid : userInfo.visitor_id;
    callback(downloads[key] && downloads[key][videoName]);
  });
}

// 记录下载到数据库
function recordDownloadToDB(videoName, url){
  var userInfo = getCurrentUserInfo();
  var body = {
    video_name: videoName,
    video_url: url,
    visitor_id: userInfo.type === 'visitor' ? userInfo.visitor_id : null
  };
  
  if(userInfo.type === 'user'){
    body.user_id = userInfo.uid;
  }
  
  fetch(SUPABASE_URL + '/rest/v1/video_downloads', {
    method: 'POST',
    headers: {
      'apikey': ANON_KEY,
      'Authorization': 'Bearer ' + ANON_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify(body)
  })
  .then(function(){
    console.log('下载记录已保存到数据库');
  })
  .catch(function(err){
    console.error('保存下载记录失败:', err);
  });
  
  // 同时保存到localStorage作为后备
  var downloads = JSON.parse(localStorage.getItem('video_downloads') || '{}');
  var key = userInfo.type === 'user' ? 'user_' + userInfo.uid : userInfo.visitor_id;
  if(!downloads[key]) downloads[key] = {};
  downloads[key][videoName] = {
    time: new Date().toISOString(),
    timestamp: Date.now()
  };
  localStorage.setItem('video_downloads', JSON.stringify(downloads));
}

function downloadVideo(url, videoName){
  // 先从数据库查询是否已经下载过
  checkDownloadedFromDB(videoName, function(hasDownloaded){
    if(hasDownloaded){
      alert('您已经下载过《' + videoName + '》了，每个账户只能下载一次。\n\n如果下载失败或需要重新下载，请联系管理员。');
      return;
    }
    
    var confirmed = confirm(
      '【下载确认】\n\n' +
      '您即将下载：《' + videoName + '》\n\n' +
      '注意事项：\n' +
      '1. 每个账户只能下载一次（包括下载中断）\n' +
      '2. 下载过程中请勿关闭页面\n' +
      '3. 下载后请妥善保存文件\n\n' +
      '确定要开始下载吗？'
    );
    
    if(!confirmed) return;
    
    // 记录下载到数据库
    recordDownloadToDB(videoName, url);
    
    // 开始下载
    var a = document.createElement('a');
    a.href = url;
    a.download = url.split('/').pop();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    
    setTimeout(function(){
      alert('下载已开始！\n\n《' + videoName + '》正在下载中，请耐心等待。\n\n注意：每个账户只能下载一次，请确保下载完成。');
    }, 500);
  });
}

/* 视频互斥播放：播放一个时暂停其他所有，同时暂停背景音乐 */
(function(){
  var videos = document.querySelectorAll('.video-player');
  var bgmWasPlaying = false;
  
  videos.forEach(function(v){
    v.addEventListener('play', function(){
      // 暂停其他所有视频
      videos.forEach(function(other){
        if(other !== v) other.pause();
      });
      // 暂停背景音乐
      if(window.BGM && BGM.isPlaying && BGM.isPlaying()){
        bgmWasPlaying = true;
        BGM.pause();
      }
    });
    v.addEventListener('pause', function(){
      // 检查是否所有视频都暂停了
      var anyPlaying = false;
      videos.forEach(function(other){
        if(!other.paused) anyPlaying = true;
      });
      // 如果所有视频都暂停了，恢复背景音乐
      if(!anyPlaying && bgmWasPlaying && window.BGM){
        BGM.play();
        bgmWasPlaying = false;
      }
    });
    v.addEventListener('ended', function(){
      // 视频结束，恢复背景音乐
      if(bgmWasPlaying && window.BGM){
        BGM.play();
        bgmWasPlaying = false;
      }
    });
  });
})();

/* 防直达检测：必须有登录标记+session，或访客验证标记，或管理员session */
(function(){
  var ok = false;
  var hasSession = localStorage.getItem('sb_session') || localStorage.getItem('sb_admin') || sessionStorage.getItem('sb_session') || sessionStorage.getItem('sb_admin');
  if(sessionStorage.getItem('logged_in') && hasSession) ok = true;
  else if(localStorage.getItem('logged_in') && hasSession){
    var exp = parseInt(localStorage.getItem('login_expire')||'0');
    if(Date.now() < exp){ ok = true; sessionStorage.setItem('logged_in','1'); }
    else{ localStorage.removeItem('logged_in'); localStorage.removeItem('login_expire'); localStorage.removeItem('sb_session'); localStorage.removeItem('sb_admin'); }
  }
  if(sessionStorage.getItem('visitor_verified')) ok = true;
  // 管理员session也算已登录
  if(localStorage.getItem('sb_admin') || sessionStorage.getItem('sb_admin')) ok = true;
  if(!ok) location.href = 'https://cqxjw-class7-2020.pages.dev/login.html';
})();
</script>
