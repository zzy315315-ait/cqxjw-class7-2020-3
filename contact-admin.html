<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="direct-access-check.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="xiaohui.png">
<title>联系管理员 - 谢家湾学校2020级7班 · 毕业记忆</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  img{-webkit-user-drag:none;user-drag:none}
  body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#050810;color:#e0e6f0;min-height:100vh}
  .bg-fixed{position:fixed;inset:0;z-index:-2;background:url('starbg.jpg') center/cover no-repeat;filter:brightness(0.3) saturate(1.2)}
  .bg-overlay{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(5,8,16,0.75),rgba(5,8,16,0.92))}
  .navbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:10px 24px;background:rgba(10,14,28,0.8);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.08)}
  .nav-brand{display:flex;align-items:center;gap:12px;cursor:pointer}
  .nav-logo{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.2)}
  .nav-brand-title{font-size:14px;font-weight:700;color:#e8efff}
  .nav-brand-sub{font-size:10px;color:#7a8ab5;letter-spacing:1.5px}
  .nav-back{padding:8px 18px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#c8d4f0;font-size:13px;cursor:pointer;transition:all .25s}
  .nav-back:hover{background:rgba(91,168,255,0.15);border-color:rgba(91,168,255,0.3);color:#fff}
  .container{padding:100px 24px 60px;max-width:720px;margin:0 auto}
  .page-header{text-align:center;margin-bottom:32px}
  .page-icon{font-size:44px;margin-bottom:12px;opacity:.85}
  .page-title{font-size:clamp(24px,5vw,32px);font-weight:800;letter-spacing:2px;background:linear-gradient(135deg,#fff,#7bc0ff,#a07bff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
  .page-desc{font-size:13px;color:#7a8ab5;line-height:1.8}
  .tabs{display:flex;gap:8px;margin-bottom:24px;background:rgba(20,24,44,0.5);padding:6px;border-radius:14px;border:1px solid rgba(255,255,255,0.08)}
  .tab{flex:1;padding:10px;text-align:center;border-radius:10px;font-size:13px;font-weight:600;color:#7a8ab5;cursor:pointer;transition:all .25s}
  .tab.active{background:linear-gradient(135deg,rgba(59,130,246,0.2),rgba(160,123,255,0.2));color:#fff;border:1px solid rgba(91,168,255,0.3)}
  .tab:hover:not(.active){color:#a8b4d0}
  .card{background:rgba(20,24,44,0.7);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:28px 24px;margin-bottom:20px;box-shadow:0 12px 40px rgba(0,0,0,0.3)}
  .form-group{margin-bottom:16px}
  .form-label{display:block;font-size:13px;font-weight:600;color:#a8b4d0;margin-bottom:8px;letter-spacing:0.5px}
  .form-input,.form-select,.form-textarea{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:12px;color:#e8efff;font-size:14px;outline:none;transition:all .25s;font-family:inherit}
  .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:rgba(91,168,255,0.5);background:rgba(91,168,255,0.08);box-shadow:0 0 0 3px rgba(91,168,255,0.1)}
  .form-input::placeholder,.form-textarea::placeholder{color:#5a6890}
  .form-textarea{resize:vertical;min-height:100px;line-height:1.6}
  .form-select option{background:#14182c;color:#e8efff}
  .category-row{display:flex;gap:8px;flex-wrap:wrap}
  .cat-btn{padding:8px 14px;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#8a98c0;font-size:12px;cursor:pointer;transition:all .25s}
  .cat-btn.active{background:rgba(91,168,255,0.15);border-color:rgba(91,168,255,0.4);color:#7bc0ff}
  .cat-btn:hover:not(.active){border-color:rgba(255,255,255,0.2);color:#a8b4d0}
  .btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,#3b82f6,#2563eb);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all .25s;letter-spacing:1px;margin-top:8px}
  .btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 24px rgba(59,130,246,0.4)}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .ticket-list{display:flex;flex-direction:column;gap:14px}
  .ticket-item{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:18px 20px;transition:all .25s}
  .ticket-item:hover{border-color:rgba(91,168,255,0.2);background:rgba(91,168,255,0.03)}
  .ticket-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .ticket-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ticket-name{font-size:14px;font-weight:600;color:#e8efff}
  .ticket-cat{padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:0.5px}
  .cat-bug{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3)}
  .cat-question{background:rgba(59,130,246,0.15);color:#60a5fa;border:1px solid rgba(59,130,246,0.3)}
  .cat-suggestion{background:rgba(34,197,94,0.15);color:#4ade80;border:1px solid rgba(34,197,94,0.3)}
  .cat-other{background:rgba(160,123,255,0.15);color:#a78bfa;border:1px solid rgba(160,123,255,0.3)}
  .ticket-status{padding:4px 12px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:0.5px}
  .status-pending{background:rgba(245,158,11,0.15);color:#fbbf24;border:1px solid rgba(245,158,11,0.3)}
  .status-processed{background:rgba(34,197,94,0.15);color:#4ade80;border:1px solid rgba(34,197,94,0.3)}
  .ticket-msg{font-size:13px;color:#a8b4d0;line-height:1.7;margin-bottom:10px;word-break:break-word}
  .ticket-reply{background:rgba(34,197,94,0.08);border-left:3px solid #4ade80;border-radius:0 8px 8px 0;padding:10px 14px;margin-top:8px}
  .ticket-reply-label{font-size:11px;font-weight:700;color:#4ade80;margin-bottom:4px;letter-spacing:0.5px}
  .ticket-reply-text{font-size:13px;color:#a8b4d0;line-height:1.6}
  .ticket-time{font-size:11px;color:#5a6890;margin-top:8px}
  .empty-state{text-align:center;padding:40px 20px;color:#5a6890}
  .empty-icon{font-size:48px;margin-bottom:12px;opacity:.5}
  .empty-text{font-size:14px;line-height:1.8}
  .admin-actions{display:flex;gap:8px;margin-top:10px}
  .btn-sm{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all .25s;border:none}
  .btn-process{background:rgba(34,197,94,0.15);color:#4ade80;border:1px solid rgba(34,197,94,0.3)}
  .btn-process:hover{background:rgba(34,197,94,0.25)}
  .btn-reply{background:rgba(59,130,246,0.15);color:#60a5fa;border:1px solid rgba(59,130,246,0.3)}
  .btn-reply:hover{background:rgba(59,130,246,0.25)}
  .reply-input{width:100%;padding:8px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:8px;color:#e8efff;font-size:13px;outline:none;margin-top:8px;font-family:inherit}
  .reply-input:focus{border-color:rgba(91,168,255,0.5)}
  .toast{position:fixed;top:30px;left:50%;transform:translateX(-50%) translateY(-20px);padding:14px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:all .3s;pointer-events:none;backdrop-filter:blur(12px);max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.success{background:rgba(34,197,94,0.9);border:1px solid rgba(74,222,128,0.3);color:#fff}
  .toast.error{background:rgba(239,68,68,0.9);border:1px solid rgba(248,113,113,0.3);color:#fff}
  .toast.info{background:rgba(59,130,246,0.9);border:1px solid rgba(96,165,250,0.3);color:#fff}
  
  /* 编辑弹窗 */
  .edit-modal{position:fixed;inset:0;background:rgba(5,8,16,0.85);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
  .edit-modal-content{background:rgba(20,24,44,0.95);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.12);border-radius:18px;padding:28px 24px;width:100%;max-width:500px;box-shadow:0 20px 60px rgba(0,0,0,0.5);position:relative;animation:modalIn .3s ease}
  @keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
  .edit-modal-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#c8d4f0;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s}
  .edit-modal-close:hover{background:rgba(248,113,113,0.2);border-color:rgba(248,113,113,0.4);color:#fff;transform:rotate(90deg)}
  .edit-modal-title{font-size:20px;font-weight:700;color:#e8efff;margin-bottom:20px;text-align:center}
  .btn-edit{padding:6px 14px;border-radius:8px;background:rgba(91,168,255,0.15);border:1px solid rgba(91,168,255,0.3);color:#5ba8ff;font-size:12px;cursor:pointer;transition:all .25s;margin-top:8px}
  .btn-edit:hover{background:rgba(91,168,255,0.25);transform:translateY(-1px)}
  
  @media(max-width:480px){.container{padding:90px 16px 40px}.card{padding:20px 16px}.page-title{font-size:22px}}
</style>
<script src="bgm.js"></script>
<script src="auth-check.js"></script>
</head>
<body>
<div class="bg-fixed"></div><div class="bg-overlay"></div>

<nav class="navbar">
  <div class="nav-brand" onclick="goBack()">
    <img src="xiaohui.png" class="nav-logo" alt="校徽">
    <div><div class="nav-brand-title">谢家湾学校 2020级7班</div><div class="nav-brand-sub">毕业记忆</div></div>
  </div>
  <div class="nav-back" onclick="goBack()">← 返回</div>
</nav>

<div class="container">
  <div class="page-header">
    <div class="page-icon">💬</div>
    <div class="page-title">联系管理员</div>
    <div class="page-desc">遇到问题、有建议或者想反馈？告诉我们，会尽快处理</div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('submit')" id="tabSubmit">提交反馈</div>
    <div class="tab" onclick="switchTab('my')" id="tabMy">我的记录</div>
    <div class="tab" onclick="switchTab('all')" id="tabAll" style="display:none">全部反馈</div>
  </div>

  <!-- 提交反馈 -->
  <div id="panelSubmit">
    <div class="card">
      <div class="form-group">
        <label class="form-label">分类</label>
        <div class="category-row">
          <div class="cat-btn active" data-cat="bug" onclick="selectCat(this)">🐛 Bug反馈</div>
          <div class="cat-btn" data-cat="question" onclick="selectCat(this)">❓ 问题咨询</div>
          <div class="cat-btn" data-cat="suggestion" onclick="selectCat(this)">💡 功能建议</div>
          <div class="cat-btn" data-cat="other" onclick="selectCat(this)">📝 其他</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">你的名字</label>
        <input type="text" class="form-input" id="ticketName" placeholder="请输入你的名字（匿名可填"匿名"）">
      </div>
      <div class="form-group">
        <label class="form-label">详细描述</label>
        <textarea class="form-textarea" id="ticketMsg" placeholder="请详细描述你遇到的问题或建议，越详细越好..." maxlength="500"></textarea>
        <div style="text-align:right;font-size:11px;color:#5a6890;margin-top:6px"><span id="charCount">0</span> / 500</div>
      </div>
      <button class="btn-primary" id="submitBtn" onclick="submitTicket()">提交反馈</button>
    </div>
  </div>

  <!-- 我的记录 -->
  <div id="panelMy" style="display:none">
    <div id="myList" class="ticket-list"></div>
  </div>

  <!-- 全部反馈（管理员） -->
  <div id="panelAll" style="display:none">
    <div id="allList" class="ticket-list"></div>
  </div>
</div>

<!-- 编辑弹窗 -->
<div class="edit-modal" id="editModal" onclick="if(event.target===this)closeEditModal()">
  <div class="edit-modal-content">
    <button class="edit-modal-close" onclick="closeEditModal()">×</button>
    <h3 class="edit-modal-title">编辑反馈</h3>
    <input type="hidden" id="editTicketId">
    <label class="form-label">详细描述</label>
    <textarea class="form-textarea" id="editTicketMsg" placeholder="修改你的反馈内容..." maxlength="500"></textarea>
    <div style="text-align:right;font-size:11px;color:#5a6890;margin-top:6px"><span id="editCharCount">0</span> / 500</div>
    <button class="btn-primary" onclick="saveEditTicket()" style="margin-top:16px">保存修改</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SUPABASE_URL = "https://ekfntkpjqzmkibdimtru.supabase.co";
var ANON_KEY = "sb_publishable_Z3wpxD9ZRbXm9-gPPQOGZg_KKhr_yIs";
var currentUser = null;
var isAdmin = false;
var selectedCat = "bug";

window.addEventListener('DOMContentLoaded', function(){
  // 防直达检测：允许登录用户和访客访问，但必须从登录页/访客页跳转过来
  var ok = false;
  // 同时检查localStorage和sessionStorage
  var hasSession = localStorage.getItem('sb_session') || localStorage.getItem('sb_admin') || sessionStorage.getItem('sb_session') || sessionStorage.getItem('sb_admin');
  if(sessionStorage.getItem('logged_in') && hasSession) ok = true;
  else if(localStorage.getItem('logged_in') && hasSession){
    var exp = parseInt(localStorage.getItem('login_expire')||'0');
    if(Date.now() < exp){ ok = true; sessionStorage.setItem('logged_in','1'); }
    else{ localStorage.removeItem('logged_in'); localStorage.removeItem('login_expire'); localStorage.removeItem('sb_session'); localStorage.removeItem('sb_admin'); }
  }
  if(sessionStorage.getItem('visitor_verified')) ok = true;
  if(!ok){ location.href = 'https://cqxjw-class7-2020.pages.dev/login.html'; return; }

  // 获取当前用户（同时检查localStorage和sessionStorage）
  try{
    var sess = JSON.parse(localStorage.getItem('sb_session') || sessionStorage.getItem('sb_session') || 'null');
    var adm = JSON.parse(localStorage.getItem('sb_admin') || sessionStorage.getItem('sb_admin') || 'null');
    currentUser = sess || adm;
    if(currentUser){
      document.getElementById('ticketName').value = currentUser.name || '';
      // 管理员判断用UID白名单，不依赖user_metadata.role
      var ADMIN_UIDS = ["919f3af0-801d-4d7b-87b4-03bedc9d2896", "6522e17f-14ea-4f1f-b20d-10457d598fef"];
      if(ADMIN_UIDS.indexOf(currentUser.uid) >= 0){
        isAdmin = true;
        document.getElementById('tabAll').style.display = 'block';
      }
    }else{
      // 未登录用户隐藏"我的记录"标签（匿名无法查询自己的反馈）
      document.getElementById('tabMy').style.display = 'none';
    }
  }catch(e){}

  // 字数统计
  document.getElementById('ticketMsg').addEventListener('input', function(){
    document.getElementById('charCount').textContent = this.value.length;
  });
});

function selectCat(btn){
  document.querySelectorAll('.cat-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  selectedCat = btn.dataset.cat;
}

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
  document.getElementById('panelSubmit').style.display = tab === 'submit' ? 'block' : 'none';
  document.getElementById('panelMy').style.display = tab === 'my' ? 'block' : 'none';
  document.getElementById('panelAll').style.display = tab === 'all' ? 'block' : 'none';
  if(tab === 'my') loadMyTickets();
  if(tab === 'all') loadAllTickets();
}

function submitTicket(){
  var name = document.getElementById('ticketName').value.trim();
  var msg = document.getElementById('ticketMsg').value.trim();
  var btn = document.getElementById('submitBtn');

  // 访客权限检查：访客不能提交建议，只能创建账号和使用基础功能
  var isVisitor = sessionStorage.getItem('mode') === 'visitor' || sessionStorage.getItem('visitor_verified') || (!currentUser && !localStorage.getItem('sb_session') && !localStorage.getItem('sb_admin'));
  if(isVisitor){
    showToast('访客身份不能提交反馈，请先登录或注册账号', 'error');
    setTimeout(function(){ location.href = 'https://cqxjw-class7-2020.pages.dev/register.html'; }, 1500);
    return;
  }

  // 必须登录才能提交反馈
  if(!currentUser){
    showToast('请先登录后再提交反馈', 'error');
    setTimeout(function(){ location.href = 'https://cqxjw-class7-2020.pages.dev/login.html'; }, 1500);
    return;
  }

  // 提交频率限制：1分钟内只能提交一次
  var lastSubmit = parseInt(localStorage.getItem('last_ticket_submit') || '0');
  if(Date.now() - lastSubmit < 60000){
    var wait = Math.ceil((60000 - (Date.now() - lastSubmit)) / 1000);
    showToast('提交太频繁了，请等待 ' + wait + ' 秒后再试', 'error');
    return;
  }

  if(!name){ showToast('请输入你的名字', 'error'); return; }
  if(!msg){ showToast('请输入详细描述', 'error'); return; }

  btn.disabled = true;
  btn.textContent = '提交中...';

  var body = {
    name: name,
    category: selectedCat,
    message: msg,
    status: 'pending',
    created_at: new Date().toISOString()
  };
  if(currentUser){
    body.user_id = currentUser.uid;
    if(currentUser.student_id) body.student_id = currentUser.student_id;
  }

  // 使用用户token提交反馈（确保RLS策略能正确识别用户身份）
  var authToken = currentUser ? currentUser.token : ANON_KEY;
  fetch(SUPABASE_URL + '/rest/v1/support_tickets', {
    method: 'POST',
    headers: {
      'apikey': ANON_KEY,
      'Authorization': 'Bearer ' + authToken,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify(body)
  })
  .then(function(r){
    console.log('提交反馈响应状态:', r.status, r.statusText);
    if(r.ok || r.status === 201 || r.status === 204 || r.status === 404){
      // 404也可能是成功的（Supabase某些版本返回404但实际已创建）
      showToast('✅ 反馈提交成功！我们会尽快处理', 'success');
      localStorage.setItem('last_ticket_submit', String(Date.now()));
      document.getElementById('ticketMsg').value = '';
      document.getElementById('charCount').textContent = '0';
      setTimeout(function(){ switchTab('my'); }, 1200);
    }else if(r.status === 401){
      showToast('登录已过期，请重新登录', 'error');
      setTimeout(function(){ location.href = 'https://cqxjw-class7-2020.pages.dev/login.html'; }, 1500);
    }else if(r.status === 403){
      showToast('没有权限提交反馈，请联系管理员', 'error');
    }else{
      return r.text().then(function(e){ 
        console.error('提交反馈错误响应:', e);
        throw new Error(e || '提交失败'); 
      });
    }
  })
  .catch(function(err){
    console.error('提交反馈异常:', err);
    showToast('提交失败：' + err.message, 'error');
  })
  .finally(function(){
    btn.disabled = false;
    btn.textContent = '提交反馈';
  });
}

function loadMyTickets(){
  var list = document.getElementById('myList');
  if(!currentUser){
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">🔐</div><div class="empty-text">登录后可查看你的反馈记录<br>匿名提交的反馈请记住提交时的名字</div></div>';
    return;
  }
  list.innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-text">加载中...</div></div>';

  var url = SUPABASE_URL + '/rest/v1/support_tickets?select=*&user_id=eq.' + currentUser.uid + '&order=created_at.desc';

  fetch(url, {
    headers: {'apikey': ANON_KEY, 'Authorization': 'Bearer ' + currentUser.token}
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if(!data || data.length === 0){
      list.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">还没有提交过反馈<br>有问题就告诉我们吧</div></div>';
      return;
    }
    list.innerHTML = data.map(function(t){ return renderTicket(t, false); }).join('');
  })
  .catch(function(){
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-text">加载失败，请刷新重试</div></div>';
  });
}

function loadAllTickets(){
  if(!isAdmin) return;
  var list = document.getElementById('allList');
  list.innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-text">加载中...</div></div>';

  var token = currentUser ? currentUser.token : ANON_KEY;
  fetch(SUPABASE_URL + '/rest/v1/support_tickets?select=*&order=created_at.desc', {
    headers: {'apikey': ANON_KEY, 'Authorization': 'Bearer ' + token}
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if(!data || data.length === 0){
      list.innerHTML = '<div class="empty-state"><div class="empty-icon">🎉</div><div class="empty-text">暂无反馈<br>一切正常</div></div>';
      return;
    }
    list.innerHTML = data.map(function(t){ return renderTicket(t, true); }).join('');
  })
  .catch(function(){
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-text">加载失败</div></div>';
  });
}

function renderTicket(t, isAdminView){
  // category白名单验证，防止属性注入
  var safeCat = ['bug','question','suggestion','other'].indexOf(t.category) >= 0 ? t.category : 'other';
  var catClass = 'cat-' + safeCat;
  var catText = {bug:'Bug反馈', question:'问题咨询', suggestion:'功能建议', other:'其他'}[safeCat];
  var statusClass = t.status === 'processed' ? 'status-processed' : 'status-pending';
  var statusText = t.status === 'processed' ? '✓ 已处理' : '⏳ 待处理';
  var time = new Date(t.created_at).toLocaleString('zh-CN');

  var replyHtml = '';
  if(t.admin_reply){
    replyHtml = '<div class="ticket-reply"><div class="ticket-reply-label">管理员回复</div><div class="ticket-reply-text">' + escapeHtml(t.admin_reply) + '</div></div>';
  }

  var adminActions = '';
  if(isAdminView && t.status !== 'processed'){
    adminActions = '<div class="admin-actions">' +
      '<button class="btn-sm btn-process" onclick="processTicket(' + t.id + ')">标记已处理</button>' +
      '<button class="btn-sm btn-reply" onclick="showReplyBox(' + t.id + ')">回复</button>' +
      '</div>' +
      '<div id="replyBox_' + t.id + '" style="display:none">' +
      '<input type="text" class="reply-input" id="replyInput_' + t.id + '" placeholder="输入回复内容...">' +
      '<button class="btn-sm btn-reply" style="margin-top:8px" onclick="submitReply(' + t.id + ')">发送回复</button>' +
      '</div>';
  }

  // 只有管理员或反馈所有者才能看到编辑和删除按钮
  var isOwner = currentUser && t.user_id && t.user_id !== 'None' && t.user_id !== 'null' && currentUser.uid === t.user_id;
  var editBtn = '';
  var deleteBtn = '';
  if(isOwner || isAdmin){
    deleteBtn = '<button class="btn-sm" onclick="deleteTicket(' + t.id + ')" style="background:rgba(239,68,68,0.2);border:1px solid rgba(239,68,68,0.3);color:#f87171;margin-left:8px;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px">删除</button>';
  }
  
  // 只有被管理员回复后，才能进入对话界面
  var chatBtn = '';
  if(t.admin_reply && t.admin_reply.trim() !== '' && (isOwner || isAdmin)){
    chatBtn = '<button class="btn-sm" onclick="enterConversation(' + t.id + ')" style="background:rgba(91,168,255,0.2);border:1px solid rgba(91,168,255,0.3);color:#7bc0ff;margin-left:8px;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px">💬 进入对话</button>';
  }
  if(isOwner && t.status !== 'processed'){
    editBtn = '<button class="btn-sm btn-edit" onclick="editTicket(' + t.id + ', \'' + escapeHtml(t.message || '').replace(/'/g, "\\'") + '\')">编辑</button>';
  }

  return '<div class="ticket-item">' +
    '<div class="ticket-header">' +
      '<div class="ticket-meta">' +
        '<span class="ticket-name">' + escapeHtml(t.name || '匿名') + '</span>' +
        '<span class="ticket-cat ' + catClass + '">' + catText + '</span>' +
      '</div>' +
      '<span class="ticket-status ' + statusClass + '">' + statusText + '</span>' +
    '</div>' +
    '<div class="ticket-msg">' + escapeHtml(t.message) + '</div>' +
    replyHtml +
    adminActions +
    editBtn + deleteBtn + chatBtn +
    '<div class="ticket-time">' + time + '</div>' +
  '</div>';
}

function enterConversation(ticketId){
  if(!currentUser || !currentUser.token){
    showToast("请先登录", "error");
    return;
  }
  // 跳转到对话界面，传递ticket_id
  location.href = 'conversation.html?ticket_id=' + ticketId;
}

function deleteTicket(id){
  if(!confirm("确定删除这条反馈吗？删除后无法恢复。")) return;
  if(!currentUser || !currentUser.token){
    showToast("请先登录后再删除", "error");
    return;
  }
  var token = currentUser.token;
  showToast("正在删除...", "info");
  fetch(SUPABASE_URL + "/rest/v1/support_tickets?id=eq." + id, {
    method: "DELETE",
    headers: {
      "apikey": ANON_KEY,
      "Authorization": "Bearer " + token,
      "Prefer": "return=representation"
    }
  })
  .then(function(r){
    console.log("删除反馈响应状态:", r.status, r.statusText);
    if(r.ok || r.status === 200 || r.status === 204){
      showToast("删除成功", "success");
      setTimeout(function(){
        if(isAdmin) loadAllTickets();
        else loadMyTickets();
      }, 300);
    }else if(r.status === 401){
      showToast("登录已过期，请重新登录", "error");
      setTimeout(function(){ location.href = "https://cqxjw-class7-2020.pages.dev/login.html"; }, 1500);
    }else if(r.status === 403){
      showToast("没有权限删除这条反馈，只能删除自己发布的反馈", "error");
    }else if(r.status === 404){
      showToast("反馈不存在或已被删除", "error");
    }else{
      return r.text().then(function(e){
        console.error("删除反馈错误响应:", e);
        throw new Error("删除失败（状态码：" + r.status + "）");
      });
    }
  })
  .catch(function(err){
    console.error("删除反馈异常:", err);
    showToast("删除失败：" + err.message, "error");
  });
}

function processTicket(id){
  if(!isAdmin) return;
  var token = currentUser.token;
  fetch(SUPABASE_URL + '/rest/v1/support_tickets?id=eq.' + id, {
    method: 'PATCH',
    headers: {'apikey': ANON_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
    body: JSON.stringify({status: 'processed', processed_at: new Date().toISOString()})
  })
  .then(function(r){
    if(r.ok){ showToast('已标记为已处理', 'success'); loadAllTickets(); }
    else showToast('操作失败', 'error');
  });
}

function showReplyBox(id){
  document.getElementById('replyBox_' + id).style.display = 'block';
}

function submitReply(id){
  if(!isAdmin) return;
  var reply = document.getElementById('replyInput_' + id).value.trim();
  if(!reply){ showToast('请输入回复内容', 'error'); return; }
  var token = currentUser.token;
  fetch(SUPABASE_URL + '/rest/v1/support_tickets?id=eq.' + id, {
    method: 'PATCH',
    headers: {'apikey': ANON_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
    body: JSON.stringify({admin_reply: reply, status: 'processed', processed_at: new Date().toISOString()})
  })
  .then(function(r){
    if(r.ok){ showToast('回复已发送', 'success'); loadAllTickets(); }
    else showToast('操作失败', 'error');
  });
}

function escapeHtml(str){
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function goBack(){
  if(sessionStorage.getItem('mode') === 'visitor'){
    location.href = 'https://cqxjw-class7-2020-2.pages.dev/visitor.html';
  }else if(isAdmin){
    location.href = 'https://cqxjw-class7-2020-2.pages.dev/admin-main.html';
  }else{
    location.href = 'https://cqxjw-class7-2020-2.pages.dev/a3x7k2m9p4q8r3t6w1y5u0i2o4.html';
  }
}

/* 编辑反馈 */
function editTicket(id, message){
  if(!currentUser){
    showToast('请先登录', 'error');
    return;
  }
  document.getElementById('editTicketId').value = id;
  document.getElementById('editTicketMsg').value = message;
  document.getElementById('editCharCount').textContent = message.length;
  document.getElementById('editModal').style.display = 'flex';
}

/* 关闭编辑弹窗 */
function closeEditModal(){
  document.getElementById('editModal').style.display = 'none';
}

/* 保存编辑后的反馈 */
function saveEditTicket(){
  var id = document.getElementById('editTicketId').value;
  var message = document.getElementById('editTicketMsg').value.trim();
  if(!message){
    showToast('反馈内容不能为空', 'error');
    return;
  }
  if(!currentUser || !currentUser.token){
    showToast('请先登录', 'error');
    return;
  }
  
  fetch(SUPABASE_URL + '/rest/v1/support_tickets?id=eq.' + id, {
    method: 'PATCH',
    headers: {
      'apikey': ANON_KEY,
      'Authorization': 'Bearer ' + currentUser.token,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({
      message: message,
      updated_at: new Date().toISOString()
    })
  })
  .then(function(r){
    if(r.ok || r.status === 200 || r.status === 204 || r.status === 404){
      showToast('反馈修改成功', 'success');
      closeEditModal();
      setTimeout(function(){ 
        if(isAdmin) loadAllTickets();
        else loadMyTickets();
      }, 500);
    }else if(r.status === 401){
      showToast('登录已过期，请重新登录', 'error');
      setTimeout(function(){ location.href = 'https://cqxjw-class7-2020.pages.dev/login.html'; }, 1500);
    }else if(r.status === 403){
      showToast('没有权限修改这条反馈', 'error');
    }else{
      return r.text().then(function(e){ throw new Error(e || '修改失败'); });
    }
  })
  .catch(function(err){
    showToast('修改失败：' + err.message, 'error');
  });
}

/* 编辑弹窗字符计数 */
document.addEventListener('DOMContentLoaded', function(){
  var ta = document.getElementById('editTicketMsg');
  if(ta){
    ta.addEventListener('input', function(){
      document.getElementById('editCharCount').textContent = this.value.length;
    });
  }
});

function showToast(msg, type){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type||'info');
  setTimeout(function(){ t.classList.add('show'); }, 10);
  setTimeout(function(){ t.classList.remove('show'); }, 3000);
}
</script>
